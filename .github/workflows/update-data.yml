name: Atualizar dados (SSP-SP → Parquet)

# Automação de ingestão: baixa/limpa/valida os dados e commita o Parquet.
# - schedule: roda no dia 5 de cada mês às 06:00 UTC.
# - workflow_dispatch: permite disparo manual pela aba Actions.
on:
  schedule:
    - cron: "0 6 5 * *"
  workflow_dispatch:

# Necessário para o passo de commit do Parquet atualizado.
permissions:
  contents: write

# Evita execuções concorrentes pisando umas nas outras.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline de ingestão
        # Sai 0 mesmo sem novos dados (no-input); só falha em erro real.
        run: python -m src.data_pipeline run --log-level INFO

      - name: Commit do Parquet atualizado (se mudou)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/processed/cleaned_data.parquet src/data/processed/quality_report.md
          if git diff --staged --quiet; then
            echo "Sem mudanças nos dados — nada a commitar."
          else
            git commit -m "chore(data): atualização automática do dataset [skip ci]"
            git push
          fi
